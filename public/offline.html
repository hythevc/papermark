<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#174b3f" />
    <meta name="robots" content="noindex" />
    <title>Reconnect to Roomline</title>
    <link rel="icon" href="/icons/roomline.svg" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        background: #f7f8f5;
        color: #202b27;
        font:
          16px/1.6 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 440px;
      }
      img {
        display: block;
        margin-bottom: 32px;
      }
      p {
        color: #52615a;
        margin: 0 0 20px;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
        letter-spacing: -0.03em;
        margin: 0 0 16px;
        text-wrap: balance;
      }
      button {
        font: inherit;
        font-weight: 600;
        min-height: 48px;
        padding: 10px 20px;
        border: 1px solid #174b3f;
        border-radius: 8px;
        background: #174b3f;
        color: #fff;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:hover {
        background: #103b31;
      }
      button:focus-visible {
        outline: 3px solid #2f806d;
        outline-offset: 4px;
      }
      .note {
        font-size: 14px;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #d5ded7;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/roomline.svg" width="48" height="48" alt="Roomline" />
      <h1>Reconnect to your workspace.</h1>
      <p>
        Roomline needs an internet connection to load your rooms and documents.
        Reconnect, then try this page again.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
      <p class="note">
        Your workspace and documents are not available offline. This screen
        contains no saved account or room data.
      </p>
    </main>
  </body>
</html>
